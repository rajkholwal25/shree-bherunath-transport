{% extends "base.html" %}
{% block title %}Login — Truck Transport{% endblock %}
{% block content %}
<div class="page-card">
  <h1 class="page-title">Log in</h1>
  <p class="page-subtitle">Sign in to manage bookings and trucks.</p>
  <form method="post" action="{{ url_for('login_page') }}" class="form">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email" value="{{ request.form.email or '' }}">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
    <p class="form-footer" style="margin-top: 0.5rem;"><a href="{{ url_for('forgot_password_page') }}">Forgot password?</a></p>
  </form>
  <p class="form-footer">Don’t have an account? <a href="{{ url_for('register_page') }}">Register</a></p>
</div>
{% endblock %}
