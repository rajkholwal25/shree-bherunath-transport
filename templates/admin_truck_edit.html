{% extends "base.html" %}
{% block title %}Admin — Edit Truck{% endblock %}
{% block content %}
<div class="page-card">
  <h1 class="page-title">Edit truck</h1>
  <p class="page-subtitle">Update truck details and image.</p>

  <form method="post" action="{{ url_for('admin_truck_edit', truck_id=truck.id) }}" class="form">
    <div class="form-group">
      <label for="truck_number">Truck number</label>
      <input id="truck_number" name="truck_number" required value="{{ truck.truck_number }}">
    </div>
    <div class="form-group">
      <label for="model">Model</label>
      <input id="model" name="model" required value="{{ truck.model }}">
    </div>
    <div class="form-group">
      <label for="capacity">Capacity</label>
      <input id="capacity" name="capacity" required value="{{ truck.capacity }}">
    </div>
    <div class="form-group">
      <label for="driver_id">Driver (optional)</label>
      <select id="driver_id" name="driver_id">
        <option value="">— No driver —</option>
        {% for d in drivers %}
          <option value="{{ d.id }}" {% if truck.driver_id and (d.id|string) == (truck.driver_id|string) %}selected{% endif %}>{{ d.name }} — {{ d.phone }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="image_url">Image URL (optional)</label>
      <input id="image_url" name="image_url" value="{{ truck.image_url or '' }}" placeholder="https://...jpg">
    </div>

    <button class="btn btn-primary btn-block" type="submit">Save changes</button>
    <a class="btn btn-ghost btn-block" href="{{ url_for('admin_trucks') }}" style="text-align:center;">Back</a>
  </form>
</div>
{% endblock %}
