{% extends "base.html" %}
{% block title %}Forgot password — Shree Bherunath Transport{% endblock %}
{% block content %}
<div class="page-card">
  <h1 class="page-title">Forgot password</h1>
  <p class="page-subtitle">Enter your email. We’ll show you a link to set a new password (no email sending needed).</p>
  <form method="post" action="{{ url_for('forgot_password_page') }}" class="form">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email" value="{{ request.form.email or '' }}">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Get reset link</button>
  </form>
  <p class="form-footer"><a href="{{ url_for('login_page') }}">Back to login</a></p>
</div>
{% endblock %}
