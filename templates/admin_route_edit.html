{% extends "base.html" %}
{% block title %}Admin — Edit Route{% endblock %}
{% block content %}
<div class="page-card">
  <h1 class="page-title">Edit route</h1>
  <p class="page-subtitle">Update from, to, and hours.</p>

  <form method="post" action="{{ url_for('admin_route_edit', route_id=route.id) }}" class="form">
    <div class="form-row">
      <div class="form-group">
        <label for="from_location">From</label>
        <input id="from_location" name="from_location" required value="{{ route.from_location }}">
      </div>
      <div class="form-group">
        <label for="to_location">To</label>
        <input id="to_location" name="to_location" required value="{{ route.to_location }}">
      </div>
    </div>
    <div class="form-group">
      <label for="hours">Hours (optional)</label>
      <input id="hours" name="hours" type="number" step="0.5" min="0" value="{{ route.hours or '' }}" placeholder="e.g. 5.5">
    </div>

    <button class="btn btn-primary btn-block" type="submit">Save changes</button>
    <a class="btn btn-ghost btn-block" href="{{ url_for('admin_routes') }}" style="text-align:center;">Back</a>
  </form>
</div>
{% endblock %}
