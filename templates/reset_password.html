{% extends "base.html" %}
{% block title %}Set new password — Shree Bherunath Transport{% endblock %}
{% block content %}
<div class="page-card">
  <h1 class="page-title">Set new password</h1>
  <p class="page-subtitle">Enter your new password twice. Then you can log in with it.</p>
  <form method="post" action="{{ url_for('reset_password_page') }}" class="form">
    <input type="hidden" name="token" value="{{ token }}">
    <div class="form-group">
      <label for="password">New password</label>
      <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="6" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Update password</button>
  </form>
  <p class="form-footer"><a href="{{ url_for('login_page') }}">Back to login</a></p>
</div>
{% endblock %}
