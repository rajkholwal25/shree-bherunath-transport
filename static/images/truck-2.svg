  <path d="M168 396 L390 460 L812 392" stroke="#111827" stroke-width="16" stroke-linecap="round"/>
  <path d="M168 396 L250 414" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" opacity=".55"/>

