    <ellipse cx="262" cy="430" rx="8" ry="6" fill="#2d3a4d"/>
  </g>
  <g>
    <ellipse cx="502" cy="412" rx="40" ry="32" fill="#0b1220" stroke="#2d3a4d" stroke-width="2"/>
    <ellipse cx="502" cy="412" rx="22" ry="16" fill="#111827"/>
    <ellipse cx="502" cy="412" rx="7" ry="5" fill="#2d3a4d"/>
  </g>
  <g>
    <ellipse cx="724" cy="388" rx="42" ry="34" fill="#0b1220" stroke="#2d3a4d" stroke-width="2"/>
    <ellipse cx="724" cy="388" rx="23" ry="17" fill="#111827"/>
