  <path d="M650 298 L732 276 L780 300 L700 322 Z" fill="#0b1220" stroke="#2d3a4d" stroke-width="2"/>
  <path d="M585 338 L640 322 L640 358 L585 374 Z" fill="url(#a1)" opacity=".75"/>

