<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" fill="none">
  <defs>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="24" y="28" width="852" height="464" rx="28" fill="#1a2332" stroke="#2d3a4d" stroke-width="2" filter="url(#shadow)"/>

  <!-- route line -->
  <path d="M160 380 C260 250, 360 260, 460 200 S650 120, 760 220" stroke="#2d3a4d" stroke-width="16" stroke-linecap="round"/>
  <path d="M160 380 C260 250, 360 260, 460 200 S650 120, 760 220" stroke="url(#r1)" stroke-width="10" stroke-linecap="round" opacity=".9"/>

  <!-- start dot -->
  <circle cx="160" cy="380" r="18" fill="#0b1220" stroke="#2d3a4d" stroke-width="2"/>
  <circle cx="160" cy="380" r="10" fill="#22c55e"/>

  <!-- end pin -->
  <path d="M720 160 C720 122 750 92 788 92 C826 92 856 122 856 160 C856 210 788 274 788 274 C788 274 720 210 720 160Z" fill="url(#r1)" stroke="#2d3a4d" stroke-width="2"/>
  <circle cx="788" cy="160" r="26" fill="#0b1220" opacity=".9"/>
  <circle cx="788" cy="160" r="12" fill="#93c5fd"/>

  <!-- small truck icon -->
  <rect x="378" y="246" width="88" height="38" rx="8" fill="#233247" stroke="#2d3a4d" stroke-width="2"/>
  <rect x="466" y="258" width="34" height="26" rx="7" fill="#233247" stroke="#2d3a4d" stroke-width="2"/>
  <circle cx="404" cy="294" r="12" fill="#0b1220" stroke="#2d3a4d" stroke-width="2"/>
  <circle cx="476" cy="294" r="12" fill="#0b1220" stroke="#2d3a4d" stroke-width="2"/>
</svg>
